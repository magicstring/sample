function register(){modal('Register new pet',`<form id="register"><h3 style="margin-bottom:18px">Basic information</h3><label class="upload"><span id="photo-preview" class="avatar">🐾</span><span>Upload pet picture<input type="file" id="photo" accept="image/*"></span></label><div class="grid"><label>Type of pet<select name="type" id="type">${options(Object.keys(breeds))}</select></label><label>Breed<select name="breed" id="breed">${options(breeds.Dog)}</select></label><label id="custom-type-label" class="full" hidden style="display:none">Specify pet type<input name="customType"></label><label id="custom-breed-label" class="full" hidden style="display:none">Specify breed<input name="customBreed" placeholder="Breed or unknown"></label><label>Pet's name<input name="name" required placeholder="e.g. Bailey"></label><label>Date of birth<input name="dob" type="date" max="${date}" required></label><label>Owner's name<input name="owner" required placeholder="Full name"></label><label>Contact / Viber number<input name="phone" type="tel" required placeholder="09XX XXX XXXX"></label><label class="full">Address<textarea name="address" rows="2" required placeholder="House number, street, city"></textarea></label></div><div class="footer-actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Register pet</button></div></form>`);let photo='';$('#type').onchange=()=>{$('#breed').innerHTML=options(breeds[$('#type').value]);$('#custom-type-label').style.display=$('#type').value==='Other'?'grid':'none';$('#custom-type-label input').required=$('#type').value==='Other';$('#breed').dispatchEvent(new Event('change'))};$('#breed').onchange=()=>{$('#custom-breed-label').style.display=$('#breed').value==='Other / Not listed'?'grid':'none'};$('#photo').onchange=e=>{if(!e.target.files[0])return;let r=new FileReader();r.onload=()=>{photo=r.result;$('#photo-preview').innerHTML=`<img class="avatar" src="${photo}" alt="Pet preview">`};r.readAsDataURL(e.target.files[0])};$('#register').onsubmit=e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.id=Date.now();p.photo=photo;if(p.type==='Other')p.type=p.customType;if(p.breed==='Other / Not listed')p.breed=p.customBreed||'Unknown';db.pets.push(p);save();closeModal();renderPets();toast('Demo: pet registered in this browser.')}}
function renderPets(){let chosen=$('#filter').value;$('#filter').innerHTML=options(['All pets',...new Set(db.pets.map(p=>p.type))]);$('#filter').value=chosen;let q=($('#search')?.value||'').toLowerCase(),filter=$('#filter')?.value||'All pets';let list=db.pets.filter(p=>(p.name+' '+p.owner+' '+p.breed).toLowerCase().includes(q)&&(filter==='All pets'||p.type===filter));$('#petlist').innerHTML=list.map(p=>`<div class="petrow"><div class="person">${avatar(p)}<div><strong>${esc(p.name)}</strong><small>${esc(p.type)} / ${esc(p.breed)}</small></div></div><div class="owner">${esc(p.owner)}<small>${esc(p.phone)}</small></div><span class="badge ${db.stays.some(s=>s.petId===p.id)?'':'neutral'}">${db.stays.some(s=>s.petId===p.id)?'Boarding':'Registered'}</span><button onclick="profile(${p.id})">View pet ↗</button></div>`).join('')||'<div class="empty">No pets match your search.</div>'}
function profile(id){let p=pet(id);modal(esc(p.name),`<div class="profile">${avatar(p)}<div><h3>${esc(p.breed)}</h3><p class="muted" style="margin-top:7px">${esc(p.type)}</p></div></div><div class="grid">${[['Date of birth',p.dob],["Owner's name",p.owner],['Contact / Viber',p.phone],['Address',p.address]].map(([a,b])=>`<div><small>${a}</small><p style="margin-top:8px">${esc(b)}</p></div>`).join('')}</div><div class="footer-actions"><a class="btn" href="history.html?pet=${p.id}">View history</a><a class="btn primary" href="${db.stays.some(s=>s.petId===p.id&&isDay(s))?'daycare':'boarding'}.html?pet=${p.id}">View stay</a></div>`)}
function renderBoarding(){let day=PAGE==='daycare';$('#stays').innerHTML=db.stays.filter(s=>isDay(s)===day).sort((a,b)=>{let order=$('#boarding-sort')?.value||'recent';return order==='recent'?b.id-a.id:pet(a.petId).name.localeCompare(pet(b.petId).name,undefined,{sensitivity:'base'})*(order==='za'?-1:1)}).map(s=>{let p=pet(s.petId);return `<article class="panel ${!day&&unpaidDue(s)?'unpaid-stay':''}"><div class="cardtop"><div class="person">${avatar(p)}<div><h2>${esc(p.name)}</h2><small>${esc(s.room)}</small></div></div><span class="badge ${!day&&unpaidDue(s)?'alert':''}">${day?'Day Care':unpaidDue(s)?(s.checkOut<localDate(currentTime())?'Unpaid: checkout overdue':'Unpaid: checkout today'):'Boarding'}</span></div><div class="staydates"><div><small>Checked in</small><strong>${day?new Date(s.checkedInAt).toLocaleString():esc(s.checkIn)}</strong></div>${day?'':`<div><small>Planned checkout</small><strong>${esc(s.checkOut)}</strong></div>`}</div><div class="rate-note">${day?'₱100 / hour for all sizes':s.size?`${esc(rates[s.size].label)}: ${money(s.rate)} / night`:'Board rate to be selected at checkout'}</div><p class="weight-on-card">Check-in weight: <strong>${s.currentWeight?esc(s.currentWeight)+' kg':'Not recorded'}</strong></p><h3>${day?'Daytime routine':'Care instructions'}</h3><div class="carepreview">${day?'':`<span>◷ ${s.meals.length} meals & treatment entries</span>`}<span>☼ ${s.routines.length} routine entries</span></div><a class="muted" href="history.html?pet=${p.id}">View pet history ↗</a><div class="payment-total"><span>Payments received</span><strong>${money(totalPayments(stayPayments(s.id)))}</strong></div><div class="actions"><button class="pay-button" onclick="pay(${s.id})">＋ Payment</button><button onclick="care(${s.id})">Edit care</button><button class="primary" onclick="checkout(${s.id})">Check out</button></div></article>`}).join('')||`<div class="panel empty">No pets in ${day?'day care':'boarding'}. Check in a pet to begin.</div>`;renderCheckedOut()}
function addRow(kind,time='',detail=''){let el=document.createElement('div');el.className='schedule-row';el.innerHTML=`<label>${kind==='meals'?'Time':'Time of day'}${kind==='meals'?`<input type="time" required value="${esc(time)}">`:`<select>${options(PAGE==='daycare'?['Daytime']:['Morning','Night'])}</select>`}</label><label>${kind==='meals'?'Meal, vitamin or treatment':'Requested routine'}<input required placeholder="${kind==='meals'?'e.g. 1 cup dry food':'e.g. 20 minute walk'}" value="${esc(detail)}"></label><button type="button" aria-label="Remove entry" onclick="this.parentElement.remove()">×</button>`;$('#'+kind).append(el);if(kind!=='meals')el.querySelector('select').value=PAGE==='daycare'?'Daytime':time||'Morning'}
function readRows(kind){return [...$('#'+kind).children].map(el=>({time:el.querySelector('input,select').value,detail:el.querySelectorAll('input')[kind==='meals'?1:0].value}))}
function care(id=null){let s=db.stays.find(s=>s.id===id),day=isDay(s),available=db.pets.filter(p=>!db.stays.some(s=>s.petId===p.id));if(!s&&!available.length){toast('All registered pets already have an active stay.');return}modal(s?`Edit ${esc(pet(s.petId).name)}'s care`:(day?'Check in for day care':'Check in for boarding'),`<form id="care-form">${s?'':`<div class="grid"><label>Pet<select name="petId">${available.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.owner)})</option>`).join('')}</select></label>${day?`<div class="note" style="margin:0">₱100 per hour for all sizes. Check-in time is recorded now.</div>`:`<label>Room<input name="room" required placeholder="e.g. Suite 02"></label><label>Check-in date<input name="checkIn" type="date" required max="${date}" value="${date}"></label><label>Planned checkout<input name="checkOut" type="date" required min="${date}" value="${date}"></label>`}</div>`}${s?weightSummary(s):`<label class="section">Current Weight (kg)<input name="currentWeight" type="number" min="0.1" step="0.1" inputmode="decimal" required placeholder="e.g. 8.5"></label>`}${!day?`<label class="section">Board rate<select name="size" required><option value="">Select pet size</option>${rateOptions()}</select></label><p class="muted" style="margin-top:10px">Charged per calendar night, with a one-night minimum.</p>`:''}${day?'':`<section class="section"><div class="sectionhead"><h3>Meals & medical treatment</h3><button type="button" onclick="addRow('meals')">＋ Add entry</button></div><div id="meals"></div></section>`}<section class="section"><div class="sectionhead"><h3>${day?'Daytime routine':'Routine'}</h3><button type="button" onclick="addRow('routines')">＋ Add routine</button></div><div id="routines"></div></section><div class="note">${day?'Each started hour is billed at ₱100.':'Care instructions are saved at check-in and checkout.'}</div><div class="footer-actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">${s?'Save care':'Check in pet'}</button></div></form>`);if(s){if(!day){$('[name=size]').value=s.size||'';s.meals.forEach(x=>addRow('meals',x.time,x.detail))}s.routines.forEach(x=>addRow('routines',x.time,x.detail))}else{if(!day)addRow('meals','08:00');addRow('routines',day?'Daytime':'Morning');let selected=new URLSearchParams(location.search).get('pet');if(available.some(p=>p.id==selected))$('[name=petId]').value=selected;if(!day)$('[name=checkIn]').onchange=e=>{$('[name=checkOut]').min=e.target.value}}$('#care-form').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(s){s.meals=day?[]:readRows('meals');s.routines=readRows('routines');if(!day){s.size=f.size;s.rate=rates[f.size].night}}else{s={...f,id:Date.now(),service:day?'daycare':'boarding',meals:day?[]:readRows('meals'),routines:readRows('routines'),checkedInAt:currentTime().toISOString()};s.petId=Number(s.petId);s.currentWeight=Number(f.currentWeight);if(day){s.checkIn=localDate(currentTime());s.room='Day Care';s.rate=100}else s.rate=rates[f.size].night;db.stays.push(s);record(s,'Check-in')}save();closeModal();renderBoarding();toast(id?'Demo: care instructions updated.':'Demo: checked in. Stay saved to pet history.')}}
function record(s,event){db.history.push({id:Date.now(),petId:s.petId,event,at:new Date().toISOString(),stay:JSON.parse(JSON.stringify(s))})}
function careDetails(s){return `<h3 class="section">Meals & medical treatment</h3><div class="snapshot">${s.meals.map(x=>`<div><strong>${esc(x.time)}</strong><span>${esc(x.detail)}</span></div>`).join('')||'<p class="muted">No meals or treatments recorded.</p>'}</div><h3 class="section">Routine</h3><div class="snapshot">${s.routines.map(x=>`<div><strong>${esc(x.time)}</strong><span>${esc(x.detail)}</span></div>`).join('')||'<p class="muted">No routine recorded.</p>'}</div>`}
function checkout(id){let s=db.stays.find(x=>x.id===id),day=isDay(s),now=currentTime(),draft=s.checkoutDraft||{};modal(`Check out ${esc(pet(s.petId).name)}`,`<form id="checkout-form"><div class="checkout-dates"><div><small>Checked in</small><strong>${day?new Date(s.checkedInAt).toLocaleString():friendlyDate(s.checkIn)}</strong></div><div><small>Checkout</small><strong>${day?now.toLocaleString():friendlyDate(localDate(now))}</strong></div></div>${weightSummary(s)}<p class="muted clock-note">Demo clock (${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}).</p>${day?'<div class="rate-note">₱100 per started hour, with a one-hour minimum.</div>':`<label class="section">Board rate<select id="checkout-size" required><option value="">Select pet size</option>${rateOptions()}</select></label><p class="muted" style="margin-top:10px">Charged per calendar night, with a one-night minimum.</p>`}<section class="section"><h3>Value added services</h3><label style="margin-top:16px">Bath and Blow Dry<select id="extra-service"><option value="">No added service</option>${Object.entries(rates).map(([key,r])=>`<option value="${key}">${r.label}: ${money(r.bath)}</option>`).join('')}</select></label></section><div id="checkout-bill" class="bill" aria-live="polite"></div><div class="footer-actions"><button type="button" onclick="closeModal()">Cancel</button><button type="button" onclick="checkoutPayment(${id})">Record payment</button><button class="primary">Confirm checkout</button></div></form>`);if(!day)$('#checkout-size').value=draft.size||s.size||'';$('#extra-service').value=draft.extra||'';$('#extra-service').onchange=()=>updateBill(id);if(!day)$('#checkout-size').onchange=()=>updateBill(id);$('#checkout-form').onsubmit=e=>{e.preventDefault();confirmCheckout(id)};updateBill(id)}
function confirmCheckout(id){let s=db.stays.find(x=>x.id===id),now=currentTime();s.invoice=checkoutInvoice(id);if(!s.invoice)return;if(!isDay(s)){s.size=$('#checkout-size').value;s.rate=rates[s.size].night}s.actualCheckout=now.toISOString();s.actualCheckoutDate=localDate(now);s.paymentReceived=totalPayments(stayPayments(id));delete s.checkoutDraft;record(s,'Checkout');db.stays=db.stays.filter(x=>x.id!==id);save();modal('Checkout recorded',`<div class="note" style="margin-top:0">Demo: ${esc(pet(s.petId).name)} checked out on ${friendlyDate(s.actualCheckoutDate)}.</div>${invoiceHTML(s.invoice,s.paymentReceived)}<div class="footer-actions"><button onclick="closeModal()">Done</button><a class="btn primary" href="history.html?pet=${s.petId}">View history</a></div>`);renderBoarding()}
function renderHistory(){let id=$('#history-pet').value,event=$('#event-filter').value,query=$('#history-search').value.trim().toLowerCase();const matches=petId=>{let p=pet(petId);return (!id||petId==id)&&(!query||(p.name+' '+p.owner+' '+p.breed).toLowerCase().includes(query))};let payments=db.payments.map(p=>({...p,event:'Payment',stay:{room:p.room},isPayment:true}));let list=[...db.history,...payments].filter(h=>matches(h.petId)&&(event==='All events'||h.event===event)).sort((a,b)=>b.at.localeCompare(a.at));let paid=db.payments.filter(p=>matches(p.petId));$('#history-total').innerHTML=`<span>Total payments for ${id?esc(pet(id).name):query?'matching pets':'all pets'}</span><strong>${money(totalPayments(paid))}</strong>`;$('#historylist').innerHTML=list.map(h=>`<div class="historyrow"><div><strong>${new Date(h.at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</strong><small>${new Date(h.at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</small><small>${new Date(h.at).getFullYear()}</small></div><div><span class="badge ${h.event==='Checkout'?'neutral':''}">${h.event}</span><h3 style="margin-top:10px">${esc(pet(h.petId).name)}${h.isPayment?' ('+money(h.cents/100)+')':''}</h3><small>${esc(h.stay.room)}${h.isPayment?' / '+esc(h.method):''}</small>${h.isPayment?'':`<small>Weight: ${h.stay.currentWeight?esc(h.stay.currentWeight)+' kg':'Not recorded'}${h.stay.rate?' / '+money(h.stay.rate)+(isDay(h.stay)?' per hour':' per night'):''}</small>`}</div><button onclick="${h.isPayment?'paymentDetail':'snapshot'}(${h.id})">${h.isPayment?'View payment':'View care record'} ↗</button></div>`).join('')||'<div class="empty">No history for this selection.</div>'}
function snapshot(id){let h=db.history.find(x=>x.id===id);modal(`${esc(pet(h.petId).name)}: ${h.event.toLowerCase()}`,`<p class="muted">${new Date(h.at).toLocaleString()} (${esc(h.stay.room)})</p><div class="note">Saved stay snapshot. Later edits do not change this record.</div>${weightSummary(h.stay)}${h.event==='Checkout'?`<div class="checkout-dates"><div><small>Checked in date</small><strong>${friendlyDate(h.stay.checkIn)}</strong></div><div><small>Checkout date</small><strong>${friendlyDate(h.stay.actualCheckoutDate||localDate(h.at))}</strong></div></div><div class="payment-total"><span>Payment received at checkout</span><strong>${h.stay.paymentReceived===undefined?'Not recorded':money(h.stay.paymentReceived)}</strong></div>`:''}${h.stay.invoice?invoiceHTML(h.stay.invoice,h.stay.paymentReceived||0):''}${isDay(h.stay)?'<h3 class="section">Daytime routine</h3><div class="snapshot">'+h.stay.routines.map(x=>'<div><strong>Daytime</strong><span>'+esc(x.detail)+'</span></div>').join('')+'</div>':careDetails(h.stay)}<div class="footer-actions"><button onclick="closeModal()">Close record</button></div>`)}

const methods=['GCASH','Card Payment','Bank Transfer','Cash'];
function money(n){return new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP'}).format(n)}
function totalPayments(rows){return rows.reduce((total,p)=>total+p.cents,0)/100}
function stayPayments(id){return db.payments.filter(p=>p.stayId===id)}
function pay(id,returnCheckout=false){let s=db.stays.find(x=>x.id===id);modal(`Record payment for ${esc(pet(s.petId).name)}`,`<div class="payment-total"><span>Paid for this stay</span><strong>${money(totalPayments(stayPayments(id)))}</strong></div><form id="payment-form"><div class="grid"><label>Payment type<select id="payment-method" name="method">${options(methods)}</select></label><label>Amount (PHP)<input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></label><label id="receipt-field" class="full">Upload payment screenshot<input id="receipt-file" type="file" accept="image/png,image/jpeg,image/webp" required><span class="muted">PNG, JPG or WebP, up to 1 MB.</span></label></div><img id="receipt-preview" class="receipt receipt-preview" alt="Payment screenshot preview" hidden><p id="payment-error" class="error" role="alert"></p><div class="note">Demo: records a payment already received. No funds are transferred.</div><div class="footer-actions"><button type="button" onclick="${returnCheckout?'checkout('+id+')':'closeModal()'}">Cancel</button><button class="primary" id="save-payment">Record payment</button></div></form>`);let receipt='',filename='';$('#payment-method').onchange=()=>{let cash=$('#payment-method').value==='Cash';$('#receipt-field').hidden=cash;$('#receipt-field').style.display=cash?'none':'grid';$('#receipt-file').required=!cash;$('#receipt-preview').hidden=cash||!receipt;$('#payment-error').textContent=''};$('#receipt-file').onchange=e=>{let f=e.target.files[0];receipt='';$('#receipt-preview').hidden=true;if(!f)return;if(f.size>1024*1024||!['image/png','image/jpeg','image/webp'].includes(f.type)){e.target.value='';$('#payment-error').textContent='Choose a PNG, JPG or WebP up to 1 MB.';return}$('#payment-error').textContent='';$('#save-payment').disabled=true;let reader=new FileReader();reader.onload=()=>{receipt=reader.result;filename=f.name;$('#receipt-preview').src=receipt;$('#receipt-preview').hidden=false;$('#save-payment').disabled=false};reader.readAsDataURL(f)};$('#payment-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),method=f.get('method');if(method!=='Cash'&&!receipt){$('#payment-error').textContent='Upload the payment screenshot first.';return}let payment={id:Date.now(),stayId:s.id,petId:s.petId,room:s.room,service:s.service||'boarding',checkIn:s.checkIn,at:new Date().toISOString(),method,cents:Math.round(Number(f.get('amount'))*100),receipt:method==='Cash'?'':receipt,filename:method==='Cash'?'':filename};db.payments.push(payment);try{save()}catch(error){db.payments.pop();$('#payment-error').textContent='Browser storage is full. Try a smaller screenshot.';return}closeModal();renderBoarding();if(returnCheckout)checkout(id);toast('Demo: payment saved to pet history, Dashboard and Transactions.')}}
function paymentDetail(id){let p=db.payments.find(p=>p.id===id);modal('Payment recorded',`<span class="badge">${esc(p.method)}</span><h2 class="payment-amount">${money(p.cents/100)}</h2><div class="payment-info"><div><small>Pet</small><strong>${esc(pet(p.petId).name)}</strong></div><div><small>Recorded on</small><strong>${new Date(p.at).toLocaleString()}</strong></div><div><small>Service stay</small><strong>${esc(p.room)}</strong></div><div><small>Check-in date</small><strong>${esc(p.checkIn)}</strong></div></div>${p.receipt?`<h3>Payment screenshot</h3><img class="receipt" src="${esc(p.receipt)}" alt="Payment screenshot for ${esc(pet(p.petId).name)}"><a class="btn" href="${esc(p.receipt)}" download="${esc(p.filename)}">Download receipt</a>`:'<p class="note">Cash payment. No screenshot required.</p>'}<div class="footer-actions"><button onclick="closeModal()">Close record</button></div>`)}
function paymentRows(rows){return rows.map(p=>`<div class="payment-row"><div><strong>${esc(pet(p.petId).name)}</strong><small>${new Date(p.at).toLocaleDateString()} (${esc(p.room)})</small></div><span class="payment-method">${esc(p.method)}</span><strong>${money(p.cents/100)}</strong><button onclick="paymentDetail(${p.id})">View payment</button></div>`).join('')||'<div class="empty">No payments recorded. Add a payment from Boarding.</div>'}
function methodTotals(rows){return methods.map(m=>`<div><span>${m}</span><strong>${money(totalPayments(rows.filter(p=>p.method===m)))}</strong></div>`).join('')}
function boardingLedger(){let stays=new Map();const key=(s,p)=>s.id||`${p}-${s.checkIn}-${s.room}`;for(let h of [...db.history].sort((a,b)=>a.at.localeCompare(b.at))){if(!['Check-in','Checkout'].includes(h.event))continue;let s=h.stay,k=key(s,h.petId);stays.set(k,{...stays.get(k),...s,petId:h.petId,end:h.event==='Checkout'?(s.actualCheckoutDate||localDate(h.at)):null})}for(let s of db.stays)stays.set(key(s,s.petId),{...s,end:null});return [...stays.values()]}
function renderDashboard(){let today=localDate(currentTime()),month=today.slice(0,7),year=today.slice(0,4),rows=[...db.payments].sort((a,b)=>b.at.localeCompare(a.at)),stays=boardingLedger();$('#today-payments').textContent=money(totalPayments(rows.filter(p=>localDate(p.at)===today)));$('#month-payments').textContent=money(totalPayments(rows.filter(p=>localDate(p.at).startsWith(month))));$('#checkins-today').textContent=stays.filter(s=>s.checkIn===today).length;$('#checkins-month').textContent=stays.filter(s=>s.checkIn.startsWith(month)).length;$('#checkins-year').textContent=stays.filter(s=>s.checkIn.startsWith(year)).length;const boarded=start=>new Set(stays.filter(s=>!isDay(s)&&s.checkIn<=today&&(!s.end||s.end>=start)).map(s=>s.petId)).size;$('#boarded-month').textContent=boarded(month+'-01');$('#boarded-year').textContent=boarded(year+'-01-01');$('#daycare-today').textContent=stays.filter(s=>isDay(s)&&s.checkIn===today).length;$('#daycare-month').textContent=stays.filter(s=>isDay(s)&&s.checkIn.startsWith(month)&&s.checkIn<=today).length;$('#dashboard-period').textContent=new Date().toLocaleDateString(undefined,{month:'long',year:'numeric'});$('#method-totals').innerHTML=methodTotals(rows);$('#recent-payments').innerHTML=paymentRows(rows.slice(0,5))}
function resetReportFilters(){['report-from','report-to','report-search'].forEach(id=>document.getElementById(id).value='');$('#report-method').selectedIndex=0;$('#report-pet').value='';renderTransactions()}
function renderCheckedOut(){let query=($('#checkout-search')?.value||'').trim().toLowerCase();let rows=db.history.filter(h=>h.event==='Checkout'&&isDay(h.stay)===(PAGE==='daycare')).filter(h=>{let p=pet(h.petId);return (p.name+' '+p.owner+' '+h.stay.room).toLowerCase().includes(query)}).sort((a,b)=>b.at.localeCompare(a.at));$('#checked-out-body').innerHTML=rows.map(h=>{let p=pet(h.petId),s=h.stay,paid=s.paymentReceived;return `<tr><td><div class="person">${avatar(p)}<div><strong>${esc(p.name)}</strong><small>${esc(p.owner)}</small><small>${esc(s.room)}</small></div></div></td><td><div class="stay-date-pair"><div><span>Checked in</span>${isDay(s)?new Date(s.checkedInAt).toLocaleString():friendlyDate(s.checkIn)}</div><div><span>Checked out</span>${isDay(s)?new Date(s.actualCheckout||h.at).toLocaleString():friendlyDate(s.actualCheckoutDate||localDate(h.at))}</div></div></td><td>${paid===undefined?'Not recorded':money(paid)}${paid===0?'<small style="color:#b33c2c">No payment</small>':''}</td><td><button onclick="snapshot(${h.id})" aria-label="View ${esc(p.name)} checkout record">View record</button></td></tr>`}).join('')||`<tr><td colspan="4" class="empty">${query?'No checked-out pets match your search.':'No completed stays yet. Checked-out pets will appear here.'}</td></tr>`}
function reportRows(){let from=$('#report-from').value,to=$('#report-to').value,method=$('#report-method').value,selected=$('#report-pet').value,query=$('#report-search').value.trim().toLowerCase();return db.payments.filter(p=>{let profile=pet(p.petId);return (!from||localDate(p.at)>=from)&&(!to||localDate(p.at)<=to)&&(method==='All payment types'||p.method===method)&&(!selected||p.petId==selected)&&(!query||(profile.name+' '+profile.owner+' '+profile.breed).toLowerCase().includes(query))}).sort((a,b)=>b.at.localeCompare(a.at))}
function renderTransactions(){let rows=reportRows();$('#report-total').textContent=money(totalPayments(rows));$('#report-count').textContent=rows.length+' recorded payments';$('#report-methods').innerHTML=methodTotals(rows);$('#report-payments').innerHTML=paymentRows(rows)}
function exportPayments(){let rows=[['Date','Pet','Room','Stay check-in','Payment type','Amount (PHP)'],...reportRows().map(p=>[p.at,pet(p.petId).name,p.room,p.checkIn,p.method,(p.cents/100).toFixed(2)])];let csv=rows.map(row=>row.map(value=>'"'+String(value).replace(/^[=+@-]/,"'").replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));let a=document.createElement('a');a.href=url;a.download='boarding-payments.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Payment report exported. Includes the selected filters.')}


function weightSummary(s){return `<div class="weight-summary"><div><span>Current weight at check-in</span><strong>${s.currentWeight?esc(s.currentWeight)+' kg':'Not recorded'}</strong></div><div><span>${isDay(s)?'Day care rate':'Board rate'}</span><strong>${isDay(s)?money(s.rate||100)+' / hour':s.size?esc(rates[s.size].label)+' ('+money(s.rate)+' / night)':'Not recorded'}</strong></div></div>`}
const rates={xs:{label:'Extra Small',weight:'up to 4.9kgs',night:650,bath:250},small:{label:'Small',weight:'5 to 11kgs',night:700,bath:300},medium:{label:'Medium',weight:'12 to 22kgs',night:900,bath:400},large:{label:'Large',weight:'23 to 38kgs',night:1000,bath:500}};
function rateOptions(){return Object.entries(rates).map(([key,r])=>`<option value="${key}">${r.label} (${r.weight}): ${money(r.night)} / night</option>`).join('')}
function isDay(s){return s?s.service==='daycare':PAGE==='daycare'}
function checkoutInvoice(id){let s=db.stays.find(x=>x.id===id),day=isDay(s),size=$('#checkout-size')?.value,extra=$('#extra-service').value;if(!day&&!size)return null;let quantity=day?Math.max(1,Math.ceil((currentTime()-new Date(s.checkedInAt))/3600000)):Math.max(1,Math.round((Date.parse(localDate(currentTime()))-Date.parse(s.checkIn))/86400000)),rate=day?100:rates[size].night,services=extra?[{name:'Bath and Blow Dry',size:rates[extra].label,amount:rates[extra].bath}]:[];return {service:day?'Day Care':'Boarding',quantity,unit:day?'hour':'night',rate,base:quantity*rate,services,total:quantity*rate+services.reduce((n,x)=>n+x.amount,0)}}
function invoiceHTML(invoice,paid){return `<div class="bill"><div class="bill-line"><span>${invoice.service}: ${invoice.quantity} ${invoice.unit}${invoice.quantity===1?'':'s'} × ${money(invoice.rate)}</span><strong>${money(invoice.base)}</strong></div>${invoice.services.map(x=>`<div class="bill-line"><span>${esc(x.name)} (${esc(x.size)})</span><strong>${money(x.amount)}</strong></div>`).join('')}<div class="bill-line"><span>Added services total</span><strong>${money(invoice.services.reduce((n,x)=>n+x.amount,0))}</strong></div><div class="payment-total"><span>Total charges</span><strong>${money(invoice.total)}</strong></div><div class="bill-line"><span>Payment received</span><strong>${money(paid)}</strong></div><div class="bill-line ${invoice.total>paid?'balance-due':''}"><strong>${paid>invoice.total?'Overpayment':'Balance due'}</strong><strong>${money(Math.abs(invoice.total-paid))}</strong></div></div>`}
function updateBill(id){let s=db.stays.find(x=>x.id===id);s.checkoutDraft={size:$('#checkout-size')?.value||'',extra:$('#extra-service').value};let invoice=checkoutInvoice(id);$('#checkout-bill').innerHTML=invoice?invoiceHTML(invoice,totalPayments(stayPayments(id))):'<div class="note">Select a board rate to calculate total charges.</div>'}
function checkoutPayment(id){if(!$('#checkout-form').reportValidity())return;updateBill(id);pay(id,true)}

if(PAGE==='pets'){renderPets();$('#search').oninput=renderPets;$('#filter').onchange=renderPets}
if(PAGE==='boarding'||PAGE==='daycare'){renderBoarding();$('#checkout-search').oninput=renderCheckedOut;if($('#boarding-sort'))$('#boarding-sort').onchange=renderBoarding;}
if(PAGE==='history'){$('#history-pet').innerHTML='<option value="">All pets</option>'+db.pets.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');let id=new URLSearchParams(location.search).get('pet');if(id&&pet(id))$('#history-pet').value=id;$('#history-pet').onchange=renderHistory;$('#event-filter').onchange=renderHistory;$('#history-search').oninput=renderHistory;renderHistory()}
if(PAGE==='login')$('#login-form').onsubmit=e=>{e.preventDefault();location.href='dashboard.html'};

if(PAGE==='dashboard')renderDashboard();
if(PAGE==='reports'){$('#report-pet').innerHTML='<option value="">All registered pets</option>'+db.pets.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.owner)})</option>`).join('');['report-from','report-to','report-method','report-pet'].forEach(id=>document.getElementById(id).onchange=renderTransactions);$('#report-search').oninput=renderTransactions;renderTransactions()}
</script></body></html>
