<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pets | Grey Pet Care</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f9f8;color:#272c29;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:clip}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button,.btn{cursor:pointer;border:1px solid #dfe4df;border-radius:7px;background:white;padding:11px 16px;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:hover,.btn:hover{background:#edf2ed}.primary{background:#252c26;color:white;border-color:#252c26}.primary:hover{background:#435747}button:focus-visible,a:focus-visible{outline:3px solid #aabdb0;outline-offset:3px}input,select,textarea{width:100%;min-width:0;border:1px solid #dfe4df;border-radius:7px;background:white;padding:12px;color:#272c29}input:focus,textarea:focus,select:focus{outline:2px solid #aabdb0}label{display:grid;gap:8px;font-size:12px;font-weight:550}h1,h2,h3,p{margin:0}h1{font-size:30px;letter-spacing:-1px}h2{font-size:19px;letter-spacing:-.4px}h3{font-size:15px}small,.muted{color:#7d887d;font-size:12px}.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:#181c19;color:#a6ada7;padding:32px 20px;display:flex;flex-direction:column}.brand{font-size:37px;font-weight:800;letter-spacing:-2px;color:white;display:flex;align-items:center;gap:10px}.brand svg{width:31px;height:31px}.brand b{color:#a9c5b1}.workspace{padding:22px 12px 30px;color:#e9efe9;font-size:13px}.workspace small{display:block;margin-top:7px}.sidebar nav{display:grid;gap:8px}.sidebar nav a{padding:13px;border-radius:7px}.sidebar nav a.active{background:#edf2ed;color:#252c26;font-weight:600}.sidebar nav a:hover{background:#354137;color:white}.sidebar .signout{margin-top:auto;padding:16px 12px}.shell{margin-left:220px}.topbar{height:75px;background:white;display:fle 4.4"/><ellipse cx="23" cy="9" rx="3.2" ry="4.4" transform="rotate(25 23 9)"/><ellipse cx="28" cy="16" rx="3" ry="4" transform="rotate(35 28 16)"/><path d="M7 23c0-5 5-11 10-10s10 8 9 12-6 3-10 2-9 2-9-4"/></svg><span>grey<b>.</b></span></a><div class="workspace">Grey Pet Care<small>Clinic & boarding</small></div><nav><a href="pets.html" class="active">♧ &nbsp;Pets</a><a href="boarding.html" class="">⌂ &nbsp;Boarding</a><a href="history.html" class="">◷ &nbsp;History</a></nav><a class="signout" href="login.html">↪ &nbsp; Sign out</a></aside><div class="shell"><header class="topbar"><span>Workspace &nbsp; / &nbsp; Pets</span><div class="subnav"><span class="demo">Demo workspace</span><a href="login.html" aria-label="Sign out">↪</a></div></header><main class="wrap"><div class="heading"><div><h1>Pets</h1><p class="muted">Pet profiles and their care history.</p></div><button class="primary" onclick="register()">＋ Register new pet</button></div><section class="panel"><div class="toolbar"><input id="search" aria-label="Search pets" placeholder="Search pets or owners"><select id="filter" aria-label="Filter pet type"><option>All pets</option><option>Dog</option><option>Cat</option><option>Bird</option><option>Rabbit</option></select></div><div id="petlist" class="petlist"></div></section></main></div><script>const PAGE="pets";
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=new Date().toISOString().slice(0,10);
const seed={pets:[{id:1,name:'Cooper',type:'Dog',breed:'Golden Retriever',dob:'2022-06-15',owner:'Olivia Martin',phone:'0917 555 0101',address:'24 Acacia Street, Quezon City'},{id:2,name:'Luna',type:'Cat',breed:'British Shorthair',dob:'2023-03-12',owner:'Sophia Chen',phone:'0917 555 0102',address:'18 Maple Street, Pasig City'},{id:3,name:'Max',type:'Dog',breed:'Labrador Retriever',dob:'2021-10-05',owner:'James Wilson',phone:'0917 555 0103',address:'7 Palm Avenue, Makati City'}],stays:[{id:1,petId:1,checkIn:'2026-10-01',checkOut:'2026-10-04',room:'Suite 01',meals:[{time:'08:00',detail:'1 cup dry food. Mix with warm water.'},{time:'18:00',detail:'1 cup dry food. Give daily vitamin after dinner.'}],routines:[{time:'Morning',detail:'20 minute walk after breakfast.'},{time:'Night',detail:'Short toilet break before bed.'}]}],history:[]};
seed.history=[{id:1,petId:1,event:'Check-in',at:'2026-10-01T09:00:00',stay:JSON.parse(JSON.stringify(seed.stays[0]))},{id:2,petId:2,event:'Checkout',at:'2026-09-25T16:00:00',stay:{room:'Cat Condo 02',checkIn:'2026-09-23',checkOut:'2026-09-25',meals:[{time:'08:00',detail:'Half pouch of wet food.'},{time:'18:00',detail:'Half pouch of wet food with fresh water.'}],routines:[{time:'Morning',detail:'Brush coat for 5 minutes.'},{time:'Night',detail:'Clean litter tray before bed.'}]}}];
let db=JSON.parse(localStorage.getItem('grey-pet-prototype')||'null')||seed;
function save(){localStorage.setItem('grey-pet-prototype',JSON.stringify(db))}function pet(id){return db.pets.find(p=>p.id==id)}
function avatar(p){return p.photo?`<img class="avatar" src="${esc(p.photo)}" alt="${esc(p.name)}">`:`<span class="avatar" aria-hidden="true">${p.type==='Cat'?'🐈':p.type==='Dog'?'🐕':'🐾'}</span>`}
function toast(t){let el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),4500)}
function closeModal(){$('.overlay')?.remove()}function modal(title,body){closeModal();let el=document.createElement('div');el.className='overlay';el.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()" aria-label="Close dialog">×</button></div>${body}</section>`;document.body.append(el);el.querySelector('input,select,button')?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const breeds={Dog:['Golden Retriever','Labrador Retriever','French Bulldog','German Shepherd','Pomeranian','Poodle','Beagle','Shih Tzu','Aspin','Mixed Breed','Other / Not listed'],Cat:['British Shorthair','Domestic Shorthair','Persian','Siamese','Maine Coon','Ragdoll','Puspin','Mixed Breed','Other / Not listed'],Bird:['Parakeet','Cockatiel','Parrot','Canary','Lovebird','Other / Not listed'],Rabbit:['Holland Lop','Mini Rex','Netherland Dwarf','Other / Not listed'],Hamster:['Syrian','Dwarf','Roborovski','Other / Not listed'],'Guinea pig':['American','Abyssinian','Peruvian','Other / Not listed'],Ferret:['Domestic','Other / Not listed'],Chinchilla:['Long-tailed','Other / Not listed'],Hedgehog:['African Pygmy','Other / Not listed'],Mouse:['Fancy Mouse','Other / Not listed'],Rat:['Fancy Rat','Other / Not listed'],Turtle:['Red-eared Slider','Box Turtle','Other / Not listed'],Tortoise:['Sulcata','Russian','Other / Not listed'],Lizard:['Leopard Gecko','Bearded Dragon','Iguana','Other / Not listed'],Snake:['Ball Python','Corn Snake','Other / Not listed'],Fish:['Goldfish','Betta','Guppy','Koi','Other / Not listed'],Amphibian:['Axolotl','Frog','Newt','Other / Not listed'],Invertebrate:['Tarantula','Hermit Crab','Other / Not listed'],Other:['Other / Not listed']};
function options(items){return items.map(x=>`<option>${esc(x)}</option>`).join('')}
function register(){modal('Register new pet',`<form id="register"><h3 style="margin-bottom:18px">Basic information</h3><label class="upload"><span id="photo-preview" class="avatar">🐾</span><span>Upload pet picture<input type="file" id="photo" accept="image/*"></span></label><div class="grid"><label>Type of pet<select name="type" id="type">${options(Object.keys(breeds))}</select></label><label>Breed<select name="breed" id="breed">${options(breeds.Dog)}</select></label><label id="custom-type-label" class="full" hidden style="display:none">Specify pet type<input name="customType"></label><label id="custom-breed-label" class="full" hidden style="display:none">Specify breed<input name="customBreed" placeholder="Breed or unknown"></label><label>Pet's name<input name="name" required placeholder="e.g. Bailey"></label><label>Date of birth<input name="dob" type="date" max="${date}" required></label><label>Owner's name<input name="owner" required placeholder="Full name"></label><label>Contact / Viber number<input name="phone" type="tel" required placeholder="09XX XXX XXXX"></label><label class="full">Address<textarea name="address" rows="2" required placeholder="House number, street, city"></textarea></label></div><div class="footer-actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Register pet</button></div></form>`);let photo='';$('#type').onchange=()=>{$('#breed').innerHTML=options(breeds[$('#type').value]);$('#custom-type-label').style.display=$('#type').value==='Other'?'grid':'none';$('#custom-type-label input').required=$('#type').value==='Other';$('#breed').dispatchEvent(new Event('change'))};$('#breed').onchange=()=>{$('#custom-breed-label').style.display=$('#breed').value==='Other / Not listed'?'grid':'none'};$('#photo').onchange=e=>{if(!e.target.files[0])return;let r=new FileReader();r.onload=()=>{photo=r.result;$('#photo-preview').innerHTML=`<img class="avatar" src="${photo}" alt="Pet preview">`};r.readAsDataURL(e.target.files[0])};$('#register').onsubmit=e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.id=Date.now();p.photo=photo;if(p.type==='Other')p.type=p.customType;if(p.breed==='Other / Not listed')p.breed=p.customBreed||'Unknown';db.pets.push(p);save();closeModal();renderPets();toast('Demo: pet registered in this browser.')}}
function renderPets(){let chosen=$('#filter').value;$('#filter').innerHTML=options(['All pets',...new Set(db.pets.map(p=>p.type))]);$('#filter').value=chosen;let q=($('#search')?.value||'').toLowerCase(),filter=$('#filter')?.value||'All pets';let list=db.pets.filter(p=>(p.name+' '+p.owner+' '+p.breed).toLowerCase().includes(q)&&(filter==='All pets'||p.type===filter));$('#petlist').innerHTML=list.map(p=>`<div class="petrow"><div class="person">${avatar(p)}<div><strong>${esc(p.name)}</strong><small>${esc(p.type)} / ${esc(p.breed)}</small></div></div><div class="owner">${esc(p.owner)}<small>${esc(p.phone)}</small></div><span class="badge ${db.stays.some(s=>s.petId===p.id)?'':'neutral'}">${db.stays.some(s=>s.petId===p.id)?'Boarding':'Registered'}</span><button onclick="profile(${p.id})">View pet ↗</button></div>`).join('')||'<div class="empty">No pets match your search.</div>'}
function profile(id){let p=pet(id);modal(esc(p.name),`<div class="profile">${avatar(p)}<div><h3>${esc(p.breed)}</h3><p class="muted" style="margin-top:7px">${esc(p.type)}</p></div></div><div class="grid">${[['Date of birth',p.dob],["Owner's name",p.owner],['Contact / Viber',p.phone],['Address',p.address]].map(([a,b])=>`<div><small>${a}</small><p style="margin-top:8px">${esc(b)}</p></div>`).join('')}</div><div class="footer-actions"><a class="btn" href="history.html?pet=${p.id}">View history</a><a class="btn primary" href="boarding.html?pet=${p.id}">View boarding</a></div>`)}
function renderBoarding(){$('#stays').innerHTML=db.stays.map(s=>{let p=pet(s.petId);return `<article class="panel"><div class="cardtop"><div class="person">${avatar(p)}<div><h2>${esc(p.name)}</h2><small>${esc(s.room)}</small></div></div><span class="badge">Boarding</span></div><div class="staydates"><div><small>Checked in</small><strong>${esc(s.checkIn)}</strong></div><div><small>Planned checkout</small><strong>${esc(s.checkOut)}</strong></div></div><h3>Care instructions</h3><div class="carepreview"><span>◷ ${s.meals.length} meals & treatment entries</span><span>☼ ${s.routines.length} routine entries</span></div><a class="muted" href="history.html?pet=${p.id}">View pet history ↗</a><div class="actions"><button onclick="care(${s.id})">Edit care</button><button class="primary" onclick="checkout(${s.id})">Check out</button></div></article>`}).join('')||'<div class="panel empty">No pets boarding. Check in a pet to begin a stay.</div>'}
function addRow(kind,time='',detail=''){let el=document.createElement('div');el.className='schedule-row';el.innerHTML=`<label>${kind==='meals'?'Time':'Time of day'}${kind==='meals'?`<input type="time" required value="${esc(time)}">`:`<select>${options(['Morning','Night'])}</select>`}</label><label>${kind==='meals'?'Meal, vitamin or treatment':'Requested routine'}<input required placeholder="${kind==='meals'?'e.g. 1 cup dry food':'e.g. 20 minute walk'}" value="${esc(detail)}"></label><button type="button" aria-label="Remove entry" onclick="this.parentElement.remove()">×</button>`;$('#'+kind).append(el);if(kind!=='meals')el.querySelector('select').value=time||'Morning'}
function readRows(kind){return [...$('#'+kind).children].map(el=>({time:el.querySelector('input,select').value,detail:el.querySelectorAll('input')[kind==='meals'?1:0].value}))}
function care(id=null){let s=db.stays.find(s=>s.id===id);let available=db.pets.filter(p=>!db.stays.some(s=>s.petId===p.id));if(!s&&!available.length){toast('All registered pets are already boarding.');return}modal(s?`Edit ${esc(pet(s.petId).name)}'s care`:'Check in a pet',`<form id="care-form">${s?`<div class="note" style="margin-top:0">Changes apply to this stay. Saved history keeps its original instructions.</div>`:`<div class="grid"><label>Pet<select name="petId">${available.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.owner)})</option>`).join('')}</select></label><label>Room<input name="room" required placeholder="e.g. Suite 02"></label><label>Check-in date<input name="checkIn" type="date" required value="${date}"></label><label>Planned checkout<input name="checkOut" type="date" required min="${date}" value="${date}"></label></div>`}<section class="section"><div class="sectionhead"><h3>Meals & medical treatment</h3><button type="button" onclick="addRow('meals')">＋ Add entry</button></div><div id="meals"></div></section><section class="section"><div class="sectionhead"><h3>Routine</h3><button type="button" onclick="addRow('routines')">＋ Add routine</button></div><div id="routines"></div></section><div class="note">Care instructions are saved to pet history at check-in and checkout.</div><div class="footer-actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">${s?'Save care':'Check in pet'}</button></div></form>`);if(s){s.meals.forEach(x=>addRow('meals',x.time,x.detail));s.routines.forEach(x=>addRow('routines',x.time,x.detail))}else{addRow('meals','08:00');addRow('routines','Morning');let selected=new URLSearchParams(location.search).get('pet');if(available.some(p=>p.id==selected))$('[name=petId]').value=selected;$('[name=checkIn]').onchange=e=>{$('[name=checkOut]').min=e.target.value}}$('#care-form').onsubmit=e=>{e.preventDefault();if(s){s.meals=readRows('meals');s.routines=readRows('routines')}else{s={...Object.fromEntries(new FormData(e.target)),id:Date.now(),meals:readRows('meals'),routines:readRows('routines')};s.petId=Number(s.petId);db.stays.push(s);record(s,'Check-in')}save();closeModal();renderBoarding();toast(id?'Demo: care instructions updated.':'Demo: checked in. Care snapshot saved to history.')}}
function record(s,event){db.history.push({id:Date.now(),petId:s.petId,event,at:new Date().toISOString(),stay:JSON.parse(JSON.stringify(s))})}
function careDetails(s){return `<h3 class="section">Meals & medical treatment</h3><div class="snapshot">${s.meals.map(x=>`<div><strong>${esc(x.time)}</strong><span>${esc(x.detail)}</span></div>`).join('')||'<p class="muted">No meals or treatments recorded.</p>'}</div><h3 class="section">Routine</h3><div class="snapshot">${s.routines.map(x=>`<div><strong>${esc(x.time)}</strong><span>${esc(x.detail)}</span></div>`).join('')||'<p class="muted">No routine recorded.</p>'}</div>`}
function checkout(id){let s=db.stays.find(x=>x.id===id);modal(`Check out ${esc(pet(s.petId).name)}`,`<p>Review the care instructions saved with this checkout.</p>${careDetails(s)}<div class="footer-actions"><button onclick="care(${id})">Edit care</button><button class="primary" onclick="confirmCheckout(${id})">Confirm checkout</button></div>`)}
function confirmCheckout(id){let s=db.stays.find(x=>x.id===id);record(s,'Checkout');db.stays=db.stays.filter(x=>x.id!==id);save();modal('Checkout recorded',`<div class="note" style="margin-top:0">Demo: ${esc(pet(s.petId).name)} checked out. Care instructions saved to history.</div><div class="footer-actions"><button onclick="closeModal()">Done</button><a class="btn primary" href="history.html?pet=${s.petId}">View history</a></div>`);renderBoarding()}
function renderHistory(){let id=$('#history-pet').value,event=$('#event-filter').value;let list=db.history.filter(h=>(!id||h.petId==id)&&(event==='All events'||h.event===event)).sort((a,b)=>b.at.localeCompare(a.at));$('#historylist').innerHTML=list.map(h=>`<div class="historyrow"><div><strong>${new Date(h.at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</strong><small>${new Date(h.at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</small><small>${new Date(h.at).getFullYear()}</small></div><div><span class="badge ${h.event==='Checkout'?'neutral':''}">${h.event}</span><h3 style="margin-top:10px">${esc(pet(h.petId).name)}</h3><small>${esc(h.stay.room)}</small></div><button onclick="snapshot(${h.id})">View care record ↗</button></div>`).join('')||'<div class="empty">No history for this selection.</div>'}
function snapshot(id){let h=db.history.find(x=>x.id===id);modal(`${esc(pet(h.petId).name)}: ${h.event.toLowerCase()}`,`<p class="muted">${new Date(h.at).toLocaleString()} (${esc(h.stay.room)})</p><div class="note">Saved care snapshot. Later edits do not change this record.</div>${careDetails(h.stay)}<div class="footer-actions"><button onclick="closeModal()">Close record</button></div>`)}
if(PAGE==='pets'){renderPets();$('#search').oninput=renderPets;$('#filter').onchange=renderPets}
if(PAGE==='boarding')renderBoarding();
if(PAGE==='history'){$('#history-pet').innerHTML='<option value="">All pets</option>'+db.pets.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');let id=new URLSearchParams(location.search).get('pet');if(id&&pet(id))$('#history-pet').value=id;$('#history-pet').onchange=renderHistory;$('#event-filter').onchange=renderHistory;renderHistory()}
if(PAGE==='login')$('#login-form').onsubmit=e=>{e.preventDefault();location.href='pets.html'};
</script></body></html>
