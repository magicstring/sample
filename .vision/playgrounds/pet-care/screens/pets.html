0 8 9 12-6 3-10 2-9 2-9-4"/></svg><span>grey<b>.</b></span></a><div class="workspace">Grey's Pet Care Services<small>Day Care and Boarding</small></div><nav><a href="dashboard.html" class="">Dashboard</a><a href="pets.html" class="active">Pets</a><a href="boarding.html" class="">Boarding</a><a href="history.html" class="">History</a><a href="reports.html" class="">Reports</a></nav><a class="signout" href="login.html">↪ &nbsp; Sign out</a></aside><div class="shell"><header class="topbar"><span>Pets</span><div class="subnav"><span class="demo">Demo workspace</span><a href="login.html" aria-label="Sign out">↪</a></div></header><main class="wrap"><div class="heading"><div><h1>Pets</h1><p class="muted">Pet profiles and their care history.</p></div><button class="primary" onclick="register()">＋ Register new pet</button></div><section class="panel"><div class="toolbar"><input id="search" aria-label="Search pets" placeholder="Search pets or owners"><select id="filter" aria-label="Filter pet type"><option>All pets</option><option>Dog</option><option>Cat</option><option>Bird</option><option>Rabbit</option></select></div><div id="petlist" class="petlist"></div></section></main></div><script>const PAGE="pets";
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function localDate(value=new Date()){let d=new Date(value);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function currentTime(){return new Date()}
function friendlyDate(value){return new Date(value+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}
function unpaidDue(s){return s.checkOut<=localDate(currentTime())&&totalPayments(stayPayments(s.id))===0}
const date=localDate(currentTime());
const seed={pets:[{id:1,name:'Cooper',type:'Dog',breed:'Golden Retriever',dob:'2022-06-15',owner:'Olivia Martin',phone:'0917 555 0101',address:'24 Acacia Street, Quezon City'},{id:2,name:'Luna',type:'Cat',breed:'British Shorthair',dob:'2023-03-12',owner:'Sophia Chen',phone:'0917 555 0102',address:'18 Maple Street, Pasig City'},{id:3,name:'Max',type:'Dog',breed:'Labrador Retriever',dob:'2021-10-05',owner:'James Wilson',phone:'0917 555 0103',address:'7 Palm Avenue, Makati City'}],stays:[{id:1,petId:1,checkIn:'2026-10-01',checkOut:'2026-10-04',room:'Suite 01',meals:[{time:'08:00',detail:'1 cup dry food. Mix with warm water.'},{time:'18:00',detail:'1 cup dry food. Give daily vitamin after dinner.'}],routines:[{time:'Morning',detail:'20 minute walk after breakfast.'},{time:'Night',detail:'Short toilet break before bed.'}]}],history:[]};
seed.history=[{id:1,petId:1,event:'Check-in',at:'2026-10-01T09:00:00',stay:JSON.parse(JSON.stringify(seed.stays[0]))},{id:2,petId:2,event:'Checkout',at:'2026-09-25T16:00:00',stay:{room:'Cat Condo 02',checkIn:'2026-09-23',checkOut:'2026-09-25',meals:[{time:'08:00',detail:'Half pouch of wet food.'},{time:'18:00',detail:'Half pouch of wet food with fresh water.'}],routines:[{time:'Morning',detail:'Brush coat for 5 minutes.'},{time:'Night',detail:'Clean litter tray before bed.'}]}}];
let db=JSON.parse(localStorage.getItem('grey-pet-prototype')||'null')||seed;
db.payments=db.payments||[];
function save(){localStorage.setItem('grey-pet-prototype',JSON.stringify(db))}function pet(id){return db.pets.find(p=>p.id==id)}
function avatar(p){return p.photo?`<img class="avatar" src="${esc(p.photo)}" alt="${esc(p.name)}">`:`<span class="avatar" aria-hidden="true">${p.type==='Cat'?'🐈':p.type==='Dog'?'🐕':'🐾'}</span>`}
function toast(t){let el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),4500)}
function closeModal(){$('.overlay')?.remove()}function modal(title,body){closeModal();let el=document.createElement('div');el.className='overlay';el.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()" aria-label="Close dialog">×</button></div>${body}</section>`;document.body.append(el);el.querySelector('input,select,button')?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const breeds={Dog:['Golden Retriever','Labrador Retriever','French Bulldog','German Shepherd','Pomeranian','Poodle','Beagle','Shih Tzu','Aspin','Mixed Breed','Other / Not listed'],Cat:['British Shorthair','Domestic Shorthair','Persian','Siamese','Maine Coon','Ragdoll','Puspin','Mixed Breed','Other / Not listed'],Bird:['Parakeet','Cockatiel','Parrot','Canary','Lovebird','Other / Not listed'],Rabbit:['Holland Lop','Mini Rex','Netherland Dwarf','Other / Not listed'],Hamster:['Syrian','Dwarf','Roborovski','Other / Not listed'],'Guinea pig':['American','Abyssinian','Peruvian','Other / Not listed'],Ferret:['Domestic','Other / Not listed'],Chinchilla:['Long-tailed','Other / Not listed'],Hedgehog:['African Pygmy','Other / Not listed'],Mouse:['Fancy Mouse','Other / Not listed'],Rat:['Fancy Rat','Other / Not listed'],Turtle:['Red-eared Slider','Box Turtle','Other / Not listed'],Tortoise:['Sulcata','Russian','Other / Not listed'],Lizard:['Leopard Gecko','Bearded Dragon','Iguana','Other / Not listed'],Snake:['Ball Python','Corn Snake','Other / Not listed'],Fish:['Goldfish','Betta','Guppy','Koi','Other / Not listed'],Amphibian:['Axolotl','Frog','Newt','Other / Not listed'],Invertebrate:['Tarantula','Hermit Crab','Other / Not listed'],Other:['Other / Not listed']};
function options(items){return items.map(x=>`<option>${esc(x)}</option>`).join('')}
function register(){modal('Register new pet',`<form id="register"><h3 style="margin-bottom:18px">Basic information</h3><label class="upload"><span id="photo-preview" class="avatar">🐾</span><span>Upload pet picture<input type="file" id="photo" accept="image/*"></span></label><div class="grid"><label>Type of pet<select name="type" id="type">${options(Object.keys(breeds))}</select></label><label>Breed<select name="breed" id="breed">${options(breeds.Dog)}</select></label><label id="custom-type-label" class="full" hidden style="display:none">Specify pet type<input name="customType"></label><label id="custom-breed-label" class="full" hidden style="display:none">Specify breed<input name="customBreed" placeholder="Breed or unknown"></label><label>Pet's name<input name="name" required placeholder="e.g. Bailey"></label><label>Date of birth<input name="dob" type="date" max="${date}" required></label><label>Owner's name<input name="owner" required placeholder="Full name"></label><label>Contact / Viber number<input name="phone" type="tel" required placeholder="09XX XXX XXXX"></label><label class="full">Address<textarea name="address" rows="2" required placeholder="House number, street, city"></textarea></label></div><div class="footer-actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Register pet</button></div></form>`);let photo='';$('#type').onchange=()=>{$('#breed').innerHTML=options(breeds[$('#type').value]);$('#custom-type-label').style.display=$('#type').value==='Other'?'grid':'none';$('#custom-type-label input').required=$('#type').value==='Other';$('#breed').dispatchEvent(new Event('change'))};$('#breed').onchange=()=>{$('#custom-breed-label').style.display=$('#breed').value==='Other / Not listed'?'grid':'none'};$('#photo').onchange=e=>{if(!e.target.files[0])return;let r=new FileReader();r.onload=()=>{photo=r.result;$('#photo-preview').innerHTML=`<img class="avatar" src="${photo}" alt="Pet preview">`};r.readAsDataURL(e.target.files[0])};$('#register').onsubmit=e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.id=Date.now();p.photo=photo;if(p.type==='Other')p.type=p.customType;if(p.breed==='Other / Not listed')p.breed=p.customBreed||'Unknown';db.pets.push(p);save();closeModal();renderPets();toast('Demo: pet registered in this browser.')}}
function renderPets(){let chosen=$('#filter').value;$('#filter').innerHTML=options(['All pets',...new Set(db.pets.map(p=>p.type))]);$('#filter').value=chosen;let q=($('#search')?.value||'').toLowerCase(),filter=$('#filter')?.value||'All pets';let list=db.pets.filter(p=>(p.name+' '+p.owner+' '+p.breed).toLowerCase().includes(q)&&(filter==='All pets'||p.type===filter));$('#petlist').innerHTML=list.map(p=>`<div class="petrow"><div class="person">${avatar(p)}<div><strong>${esc(p.name)}</strong><small>${esc(p.type)} / ${esc(p.breed)}</small></div></div><div class="owner">${esc(p.owner)}<small>${esc(p.phone)}</small></div><span class="badge ${db.stays.some(s=>s.petId===p.id)?'':'neutral'}">${db.stays.some(s=>s.petId===p.id)?'Boarding':'Registered'}</span><button onclick="profile(${p.id})">View pet ↗</button></div>`).join('')||'<div class="empty">No pets match your search.</div>'}
function profile(id){let p=pet(id);modal(esc(p.name),`<div class="profile">${avatar(p)}<div><h3>${esc(p.breed)}</h3><p class="muted" style="margin-top:7px">${esc(p.type)}</p></div></div><div class="grid">${[['Date of birth',p.dob],["Owner's name",p.owner],['Contact / Viber',p.phone],['Address',p.address]].map(([a,b])=>`<div><small>${a}</small><p style="margin-top:8px">${esc(b)}</p></div>`).join('')}</div><div class="footer-actions"><a class="btn" href="history.html?pet=${p.id}">View history</a><a class="btn primary" href="boarding.html?pet=${p.id}">View boarding</a></div>`)}
function renderBoarding(){$('#stays').innerHTML=db.stays.map(s=>{let p=pet(s.petId);return `<article class="panel ${unpaidDue(s)?'unpaid-stay':''}"><div class="cardtop"><div class="person">${avatar(p)}<div><h2>${esc(p.name)}</h2><small>${esc(s.room)}</small></div></div><span class="badge ${unpaidDue(s)?'alert':''}">${unpaidDue(s)?(s.checkOut<localDate(currentTime())?'Unpaid: checkout overdue':'Unpaid: checkout today'):'Boarding'}</span></div><div class="staydates"><div><small>Checked in</small><strong>${esc(s.checkIn)}</strong></div><div><small>Planned checkout</small><strong>${esc(s.checkOut)}</strong></div></div><h3>Care instructions</h3><div class="carepreview"><span>◷ ${s.meals.length} meals & treatment entries</span><span>☼ ${s.routines.length} routine entries</span></div><a class="muted" href="history.html?pet=${p.id}">View pet history ↗</a><div class="payment-total"><span>Payments received</span><strong>${money(totalPayments(stayPayments(s.id)))}</strong></div><div class="actions"><button class="pay-button" onclick="pay(${s.id})">＋ Payment</button><button onclick="care(${s.id})">Edit care</button><button class="primary" onclick="checkout(${s.id})">Check out</button></div></article>`}).join('')||'<div class="panel empty">No pets boarding. Check in a pet to begin a stay.</div>'}
function addRow(kind,time='',detail=''){let el=document.createElement('div');el.className='schedule-row';el.innerHTML=`<label>${kind==='meals'?'Time':'Time of day'}${kind==='meals'?`<input type="time" required value="${esc(time)}">`:`<select>${options(['Morning','Night'])}</select>`}</label><label>${kind==='meals'?'Meal, vitamin or treatment':'Requested routine'}<input required placeholder="${kind==='meals'?'e.g. 1 cup dry food':'e.g. 20 minute walk'}" value="${esc(detail)}"></label><button type="button" aria-label="Remove entry" onclick="this.parentElement.remove()">×</button>`;$('#'+kind).append(el);if(kind!=='meals')el.querySelector('select').value=time||'Morning'}
function readRows(kind){return [...$('#'+kind).children].map(el=>({time:el.querySelector('input,select').value,detail:el.querySelectorAll('input')[kind==='meals'?1:0].value}))}
function care(id=null){let s=db.stays.find(s=>s.id===id);let available=db.pets.filter(p=>!db.stays.some(s=>s.petId===p.id));if(!s&&!available.length){toast('All registered pets are already boarding.');return}modal(s?`Edit ${esc(pet(s.petId).name)}'s care`:'Check in a pet',`<form id="care-form">${s?`<div class="note" style="margin-top:0">Changes apply to this stay. Saved history keeps its original instructions.</div>`:`<div class="grid"><label>Pet<select name="petId">${available.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.owner)})</option>`).join('')}</select></label><label>Room<input name="room" required placeholder="e.g. Suite 02"></label><label>Check-in date<input name="checkIn" type="date" required value="${date}"></label><label>Planned checkout<input name="checkOut" type="date" required min="${date}" value="${date}"></label></div>`}<section class="section"><div class="sectionhead"><h3>Meals & medical treatment</h3><button type="button" onclick="addRow('meals')">＋ Add entry</button></div><div id="meals"></div></section><section class="section"><div class="sectionhead"><h3>Routine</h3><button type="button" onclick="addRow('routines')">＋ Add routine</button></div><div id="routines"></div></section><div class="note">Care instructions are saved to pet history at check-in and checkout.</div><div class="footer-actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">${s?'Save care':'Check in pet'}</button></div></form>`);if(s){s.meals.forEach(x=>addRow('meals',x.time,x.detail));s.routines.forEach(x=>addRow('routines',x.time,x.detail))}else{addRow('meals','08:00');addRow('routines','Morning');let selected=new URLSearchParams(location.search).get('pet');if(available.some(p=>p.id==selected))$('[name=petId]').value=selected;$('[name=checkIn]').onchange=e=>{$('[name=checkOut]').min=e.target.value}}$('#care-form').onsubmit=e=>{e.preventDefault();if(s){s.meals=readRows('meals');s.routines=readRows('routines')}else{s={...Object.fromEntries(new FormData(e.target)),id:Date.now(),meals:readRows('meals'),routines:readRows('routines')};s.petId=Number(s.petId);db.stays.push(s);record(s,'Check-in')}save();closeModal();renderBoarding();toast(id?'Demo: care instructions updated.':'Demo: checked in. Care snapshot saved to history.')}}
function record(s,event){db.history.push({id:Date.now(),petId:s.petId,event,at:new Date().toISOString(),stay:JSON.parse(JSON.stringify(s))})}
function careDetails(s){return `<h3 class="section">Meals & medical treatment</h3><div class="snapshot">${s.meals.map(x=>`<div><strong>${esc(x.time)}</strong><span>${esc(x.detail)}</span></div>`).join('')||'<p class="muted">No meals or treatments recorded.</p>'}</div><h3 class="section">Routine</h3><div class="snapshot">${s.routines.map(x=>`<div><strong>${esc(x.time)}</strong><span>${esc(x.detail)}</span></div>`).join('')||'<p class="muted">No routine recorded.</p>'}</div>`}
function checkout(id){let s=db.stays.find(x=>x.id===id),now=currentTime(),received=totalPayments(stayPayments(id));modal(`Check out ${esc(pet(s.petId).name)}`,`<div class="checkout-dates"><div><small>Checked in date</small><strong>${friendlyDate(s.checkIn)}</strong></div><div><small>Checkout date</small><strong>${friendlyDate(localDate(now))}</strong></div></div><p class="muted clock-note">Demo time (${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}), using your browser clock.</p><div class="payment-total"><span>Payment received</span><strong>${money(received)}</strong></div>${received===0?'<div class="unpaid-note" role="status">No payment received.</div>':''}<div class="footer-actions"><button onclick="closeModal()">Cancel</button>${received===0?`<button onclick="pay(${id})">Record payment</button>`:''}<button class="primary" onclick="confirmCheckout(${id})">Confirm checkout</button></div>`)}
function confirmCheckout(id){let s=db.stays.find(x=>x.id===id),now=currentTime();s.actualCheckout=now.toISOString();s.actualCheckoutDate=localDate(now);s.paymentReceived=totalPayments(stayPayments(id));record(s,'Checkout');db.stays=db.stays.filter(x=>x.id!==id);save();modal('Checkout recorded',`<div class="note" style="margin-top:0">Demo: ${esc(pet(s.petId).name)} checked out on ${friendlyDate(s.actualCheckoutDate)}. Payment received: ${money(s.paymentReceived)}.</div><div class="footer-actions"><button onclick="closeModal()">Done</button><a class="btn primary" href="history.html?pet=${s.petId}">View history</a></div>`);renderBoarding()}
function renderHistory(){let id=$('#history-pet').value,event=$('#event-filter').value;let payments=db.payments.map(p=>({...p,event:'Payment',stay:{room:p.room},isPayment:true}));let list=[...db.history,...payments].filter(h=>(!id||h.petId==id)&&(event==='All events'||h.event===event)).sort((a,b)=>b.at.localeCompare(a.at));let paid=db.payments.filter(p=>!id||p.petId==id);$('#history-total').innerHTML=`<span>Total payments for ${id?esc(pet(id).name):'all pets'}</span><strong>${money(totalPayments(paid))}</strong>`;$('#historylist').innerHTML=list.map(h=>`<div class="historyrow"><div><strong>${new Date(h.at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</strong><small>${new Date(h.at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</small><small>${new Date(h.at).getFullYear()}</small></div><div><span class="badge ${h.event==='Checkout'?'neutral':''}">${h.event}</span><h3 style="margin-top:10px">${esc(pet(h.petId).name)}${h.isPayment?' ('+money(h.cents/100)+')':''}</h3><small>${esc(h.stay.room)}${h.isPayment?' / '+esc(h.method):''}</small></div><button onclick="${h.isPayment?'paymentDetail':'snapshot'}(${h.id})">${h.isPayment?'View payment':'View care record'} ↗</button></div>`).join('')||'<div class="empty">No history for this selection.</div>'}
function snapshot(id){let h=db.history.find(x=>x.id===id);modal(`${esc(pet(h.petId).name)}: ${h.event.toLowerCase()}`,`<p class="muted">${new Date(h.at).toLocaleString()} (${esc(h.stay.room)})</p><div class="note">Saved care snapshot. Later edits do not change this record.</div>${h.event==='Checkout'?`<div class="checkout-dates"><div><small>Checked in date</small><strong>${friendlyDate(h.stay.checkIn)}</strong></div><div><small>Checkout date</small><strong>${friendlyDate(h.stay.actualCheckoutDate||localDate(h.at))}</strong></div></div><div class="payment-total"><span>Payment received at checkout</span><strong>${h.stay.paymentReceived===undefined?'Not recorded':money(h.stay.paymentReceived)}</strong></div>`:''}${careDetails(h.stay)}<div class="footer-actions"><button onclick="closeModal()">Close record</button></div>`)}

const methods=['GCASH','Card Payment','Bank Transfer','Cash'];
function money(n){return new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP'}).format(n)}
function totalPayments(rows){return rows.reduce((total,p)=>total+p.cents,0)/100}
function stayPayments(id){return db.payments.filter(p=>p.stayId===id)}
function pay(id){let s=db.stays.find(x=>x.id===id);modal(`Record payment for ${esc(pet(s.petId).name)}`,`<div class="payment-total"><span>Paid for this stay</span><strong>${money(totalPayments(stayPayments(id)))}</strong></div><form id="payment-form"><div class="grid"><label>Payment type<select id="payment-method" name="method">${options(methods)}</select></label><label>Amount (PHP)<input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></label><label id="receipt-field" class="full">Upload payment screenshot<input id="receipt-file" type="file" accept="image/png,image/jpeg,image/webp" required><span class="muted">PNG, JPG or WebP, up to 1 MB.</span></label></div><img id="receipt-preview" class="receipt receipt-preview" alt="Payment screenshot preview" hidden><p id="payment-error" class="error" role="alert"></p><div class="note">Demo: records a payment already received. No funds are transferred.</div><div class="footer-actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary" id="save-payment">Record payment</button></div></form>`);let receipt='',filename='';$('#payment-method').onchange=()=>{let cash=$('#payment-method').value==='Cash';$('#receipt-field').hidden=cash;$('#receipt-field').style.display=cash?'none':'grid';$('#receipt-file').required=!cash;$('#receipt-preview').hidden=cash||!receipt;$('#payment-error').textContent=''};$('#receipt-file').onchange=e=>{let f=e.target.files[0];receipt='';$('#receipt-preview').hidden=true;if(!f)return;if(f.size>1024*1024||!['image/png','image/jpeg','image/webp'].includes(f.type)){e.target.value='';$('#payment-error').textContent='Choose a PNG, JPG or WebP up to 1 MB.';return}$('#payment-error').textContent='';$('#save-payment').disabled=true;let reader=new FileReader();reader.onload=()=>{receipt=reader.result;filename=f.name;$('#receipt-preview').src=receipt;$('#receipt-preview').hidden=false;$('#save-payment').disabled=false};reader.readAsDataURL(f)};$('#payment-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),method=f.get('method');if(method!=='Cash'&&!receipt){$('#payment-error').textContent='Upload the payment screenshot first.';return}let payment={id:Date.now(),stayId:s.id,petId:s.petId,room:s.room,checkIn:s.checkIn,at:new Date().toISOString(),method,cents:Math.round(Number(f.get('amount'))*100),receipt:method==='Cash'?'':receipt,filename:method==='Cash'?'':filename};db.payments.push(payment);try{save()}catch(error){db.payments.pop();$('#payment-error').textContent='Browser storage is full. Try a smaller screenshot.';return}closeModal();renderBoarding();toast('Demo: payment saved to pet history, Dashboard and Reports.')}}
function paymentDetail(id){let p=db.payments.find(p=>p.id===id);modal('Payment recorded',`<span class="badge">${esc(p.method)}</span><h2 class="payment-amount">${money(p.cents/100)}</h2><div class="payment-info"><div><small>Pet</small><strong>${esc(pet(p.petId).name)}</strong></div><div><small>Recorded on</small><strong>${new Date(p.at).toLocaleString()}</strong></div><div><small>Boarding stay</small><strong>${esc(p.room)}</strong></div><div><small>Check-in date</small><strong>${esc(p.checkIn)}</strong></div></div>${p.receipt?`<h3>Payment screenshot</h3><img class="receipt" src="${esc(p.receipt)}" alt="Payment screenshot for ${esc(pet(p.petId).name)}"><a class="btn" href="${esc(p.receipt)}" download="${esc(p.filename)}">Download receipt</a>`:'<p class="note">Cash payment. No screenshot required.</p>'}<div class="footer-actions"><button onclick="closeModal()">Close record</button></div>`)}
function paymentRows(rows){return rows.map(p=>`<div class="payment-row"><div><strong>${esc(pet(p.petId).name)}</strong><small>${new Date(p.at).toLocaleDateString()} (${esc(p.room)})</small></div><span class="payment-method">${esc(p.method)}</span><strong>${money(p.cents/100)}</strong><button onclick="paymentDetail(${p.id})">View payment</button></div>`).join('')||'<div class="empty">No payments recorded. Add a payment from Boarding.</div>'}
function methodTotals(rows){return methods.map(m=>`<div><span>${m}</span><strong>${money(totalPayments(rows.filter(p=>p.method===m)))}</strong></div>`).join('')}
function boardingLedger(){let stays=new Map();const key=(s,p)=>`${p}-${s.checkIn}-${s.room}`;for(let h of [...db.history].sort((a,b)=>a.at.localeCompare(b.at))){if(!['Check-in','Checkout'].includes(h.event))continue;let s=h.stay,k=key(s,h.petId);stays.set(k,{...stays.get(k),...s,petId:h.petId,end:h.event==='Checkout'?(s.actualCheckoutDate||localDate(h.at)):null})}for(let s of db.stays)stays.set(key(s,s.petId),{...s,end:null});return [...stays.values()]}
function renderDashboard(){let today=localDate(currentTime()),month=today.slice(0,7),year=today.slice(0,4),rows=[...db.payments].sort((a,b)=>b.at.localeCompare(a.at)),stays=boardingLedger();$('#today-payments').textContent=money(totalPayments(rows.filter(p=>localDate(p.at)===today)));$('#month-payments').textContent=money(totalPayments(rows.filter(p=>localDate(p.at).startsWith(month))));$('#checkins-today').textContent=stays.filter(s=>s.checkIn===today).length;$('#checkins-month').textContent=stays.filter(s=>s.checkIn.startsWith(month)).length;$('#checkins-year').textContent=stays.filter(s=>s.checkIn.startsWith(year)).length;const boarded=start=>new Set(stays.filter(s=>s.checkIn<=today&&(!s.end||s.end>=start)).map(s=>s.petId)).size;$('#boarded-month').textContent=boarded(month+'-01');$('#boarded-year').textContent=boarded(year+'-01-01');$('#dashboard-period').textContent=new Date().toLocaleDateString(undefined,{month:'long',year:'numeric'});$('#method-totals').innerHTML=methodTotals(rows);$('#recent-payments').innerHTML=paymentRows(rows.slice(0,5))}
function reportRows(){let from=$('#report-from').value,to=$('#report-to').value,method=$('#report-method').value;return db.payments.filter(p=>(!from||localDate(p.at)>=from)&&(!to||localDate(p.at)<=to)&&(method==='All payment types'||p.method===method)).sort((a,b)=>b.at.localeCompare(a.at))}
function renderReports(){let rows=reportRows();$('#report-total').textContent=money(totalPayments(rows));$('#report-count').textContent=rows.length+' recorded payments';$('#report-methods').innerHTML=methodTotals(rows);$('#report-payments').innerHTML=paymentRows(rows)}
function exportPayments(){let rows=[['Date','Pet','Room','Stay check-in','Payment type','Amount (PHP)'],...reportRows().map(p=>[p.at,pet(p.petId).name,p.room,p.checkIn,p.method,(p.cents/100).toFixed(2)])];let csv=rows.map(row=>row.map(value=>'"'+String(value).replace(/^[=+@-]/,"'").replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));let a=document.createElement('a');a.href=url;a.download='boarding-payments.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Payment report exported. Includes the selected filters.')}

if(PAGE==='pets'){renderPets();$('#search').oninput=renderPets;$('#filter').onchange=renderPets}
if(PAGE==='boarding')renderBoarding();
if(PAGE==='history'){$('#history-pet').innerHTML='<option value="">All pets</option>'+db.pets.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');let id=new URLSearchParams(location.search).get('pet');if(id&&pet(id))$('#history-pet').value=id;$('#history-pet').onchange=renderHistory;$('#event-filter').onchange=renderHistory;renderHistory()}
if(PAGE==='login')$('#login-form').onsubmit=e=>{e.preventDefault();location.href='dashboard.html'};

if(PAGE==='dashboard')renderDashboard();
if(PAGE==='reports'){['report-from','report-to','report-method'].forEach(id=>document.getElementById(id).onchange=renderReports);renderReports()}
</script></body></html>
