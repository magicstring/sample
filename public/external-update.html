<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Update Dog Profile | Grey's Pet Care Services</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#272c29;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #dfe4df;border-radius:7px;background:white;padding:11px 16px;color:inherit}button:hover{background:#edf2ed}.primary{background:#252c26;color:white;border-color:#252c26}.primary:hover{background:#435747}input,select,textarea{width:100%;border:1px solid #dfe4df;border-radius:7px;background:white;padding:12px;color:#272c29}input:focus,textarea:focus,select:focus{outline:2px solid #aabdb0}label{display:grid;gap:8px;font-size:12px;font-weight:550}h1,h2,h3,p{margin:0}.page{max-width:760px;margin:0 auto;padding:32px 16px 60px}.brand{font-size:30px;font-weight:800;letter-spacing:-1.5px;margin-bottom:28px}.brand b{color:#6f8c73}.card{background:white;border:1px solid #e2e7e1;border-radius:14px;padding:30px;box-shadow:0 15px 50px #23332206}.intro{margin:10px 0 28px;color:#7d887d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}.section{margin-top:30px}.section h3{margin-bottom:16px}.schedule{display:grid;grid-template-columns:120px 1fr auto;gap:10px;margin:10px 0;align-items:end}.schedule button{padding:10px 12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-head button{padding:7px 12px}.upload{display:flex;align-items:center;gap:16px;padding:16px;background:#fafbf8;border:1px dashed #bac9b5;border-radius:8px}.upload img{width:74px;height:74px;border-radius:50%;object-fit:cover}.important{background:#fff0ed;color:#a12d24;padding:18px;border-radius:8px}.important textarea{border-color:#d8968f}.actions{display:flex;justify-content:flex-end;margin-top:30px}.error{color:#a24535;margin-top:18px}.status{text-align:center;padding:45px 25px}.status p{margin-top:14px;color:#7d887d;line-height:1.6}@media(max-width:600px){.card{padding:22px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.schedule{grid-template-columns:95px 1fr auto}.page{padding-top:22px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="brand">grey<b>.</b></div>
    <section class="card" id="content"><div class="status"><h1>Opening dog profile</h1><p>Checking this secure update link.</p></div></section>
  </main>
  <script>
    const content=document.getElementById('content'),token=new URLSearchParams(location.search).get('token');
    const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const vaccineFields=[['arvExpiration','Anti Rabies Vaccine Expiration','date'],['atfBrand','Anti Tick and Flea Brand','text'],['atfExpiration','Anti Tick and Flea Expiration','date'],['kcExpiration','Kennel Cough Expiration','date'],['combinationExpiration','5-6-8 in one Expiration','date']];
    let profile,photo='';
    const row=(group,item={})=>`<div class="schedule"><input aria-label="Time" type="time" value="${esc(item.time||'')}"><input aria-label="Details" value="${esc(item.detail||'')}"><button type="button" aria-label="Remove entry" onclick="this.parentElement.remove()">×</button></div>`;
    function addRow(group){document.getElementById(group).insertAdjacentHTML('beforeend',row(group))}
    function scheduleValues(group){return [...document.querySelectorAll(`#${group} .schedule`)].map(item=>({time:item.children[0].value,detail:item.children[1].value.trim()})).filter(item=>item.time||item.detail)}
    function showError(message){content.innerHTML=`<div class="status"><h1>Unable to update profile</h1><p>${esc(message)}</p></div>`}
    function render(){photo=profile.photo||'';content.innerHTML=`<h1>Update ${esc(profile.name)}'s profile</h1><p class="intro">Enter your name first. It will be recorded with this update.</p><form id="form"><div class="grid"><label class="full">Your name<input name="updaterName" maxlength="100" required autocomplete="name" placeholder="Name of person making this update"></label><label class="upload full"><span id="photo-preview">${photo?`<img src="${esc(photo)}" alt="Dog picture">`:'No dog picture'}</span><span>Upload dog picture<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></span></label></div><section class="section"><h3>Vaccine Information</h3><div class="grid">${vaccineFields.map(([key,label,type])=>`<label>${label}<input name="${key}" type="${type}" value="${esc(profile[key]||'')}"></label>`).join('')}</div></section><section class="section"><h3>Basic Information</h3><div class="grid"><label>Breed<input name="breed" required value="${esc(profile.breed||'')}"></label><label>Dog's Name<input name="name" required value="${esc(profile.name||'')}"></label><label>Date of birth<input name="dob" type="date" value="${esc(profile.dob||'')}"></label><label>Weight (kg)<input name="weight" type="number" min="0.01" step="0.01" value="${esc(profile.weight??'')}"></label><label>Owner's name<input name="owner" required value="${esc(profile.owner||'')}"></label><label>Contact / Viber number<input name="phone" required value="${esc(profile.phone||'')}"></label><label class="full">Address<textarea name="address" rows="2" required>${esc(profile.address||'')}</textarea></label></div></section>${[['meals','Medicine/Vitamins Information'],['feeding','Meal/Feeding Information'],['routines','Requested Routine']].map(([key,title])=>`<section class="section"><div class="section-head"><h3>${title}</h3><button type="button" onclick="addRow('${key}')">＋ Add entry</button></div><div id="${key}">${(profile[key]||[]).map(item=>row(key,item)).join('')}</div></section>`).join('')}<label class="important section">Important Note<textarea name="importantNote" rows="3">${esc(profile.importantNote||'')}</textarea></label><p id="error" class="error" role="alert"></p><div class="actions"><button class="primary">Update profile</button></div></form>`;
      document.getElementById('photo').onchange=event=>{let file=event.target.files[0];if(!file)return;if(file.size>5*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type)){document.getElementById('error').textContent='Choose a JPG, PNG or WebP under 5 MB.';event.target.value='';return}let reader=new FileReader();reader.onload=()=>{photo=reader.result;document.getElementById('photo-preview').innerHTML=`<img src="${esc(photo)}" alt="Dog picture">`};reader.readAsDataURL(file)};
      document.getElementById('form').onsubmit=submit;
    }
    async function submit(event){event.preventDefault();let form=event.currentTarget,button=form.querySelector('button.primary'),data=Object.fromEntries(new FormData(form));button.disabled=true;button.textContent='Saving...';let next={...profile,...data,type:'Dog',photo,weight:data.weight?Number(data.weight):'',meals:scheduleValues('meals'),feeding:scheduleValues('feeding'),routines:scheduleValues('routines')};delete next.updaterName;try{let response=await fetch(`/api/external-updates/${encodeURIComponent(token)}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({name:data.updaterName,profile:next})}),result=await response.json();if(!response.ok)throw Error(result.error||'Unable to save the update.');content.innerHTML='<div class="status"><h1>Profile updated</h1><p>You can close this page. The update will appear on the original device.</p></div>'}catch(error){document.getElementById('error').textContent=error.message;button.disabled=false;button.textContent='Update profile'}}
    (async()=>{if(!token)return showError('This update link is missing its secure token.');try{let response=await fetch(`/api/external-updates/${encodeURIComponent(token)}`),result=await response.json();if(!response.ok)throw Error(result.error||'Unable to open this profile.');profile=result.profile;render()}catch(error){showError(error.message)}})();
  </script>
</body>
</html>
